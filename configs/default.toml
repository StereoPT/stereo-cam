# The built-in defaults. Every setting is optional: leave one out and it
# keeps this value.
trigger_gesture = "FingertipsTouching"   # both hands, thumb tips and index tips together; or one of the
                              # model's signs: Closed_Fist, Open_Palm, Pointing_Up, Thumb_Down, Thumb_Up, Victory, ILoveYou
trigger_threshold = 0.8       # minimum confidence, 0 to 1

hold_duration = 0.5           # seconds the sign must be held
hold_grace = 0.1              # seconds the sign may drop out without resetting the hold

dissolve_duration = 1.0       # seconds the fade takes
effect = "glitch"             # fade, pixelate or glitch

requested_fps = 30            # frame rate asked of the camera (it may refuse)
camera_index = 0
countdown_seconds = 3         # capture countdown

track_face = true             # find your face, so captions can follow it

captions = true            # show what you say as subtitles (local speech recognition)
speech_model = "base"         # Whisper model: tiny, base, small; the ".en" ones only understand English
speech_languages = ["en", "pt"]  # languages you speak; the first is used at start, and L switches
caption_seconds = 4.0         # how long a phrase stays on screen
caption_scale = 1.0           # text size relative to your face; 2.0 is twice as big
caption_emphasis = 1.0       # how much bigger a word you say louder gets; 0 turns it off
caption_tilt = 0.6            # how much the caption tilts with your head; 0 turns it off, 1 follows it fully
caption_font_seconds = 0.4    # how often the caption switches to another font
microphone = -1               # sound input device index; -1 is the system default
