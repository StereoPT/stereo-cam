[project]
name = "stereo-cam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "StereoPT", email = "stereopt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "fonttools>=4.67.0",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyvirtualcam>=0.15.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
stereo-cam = "stereo_cam.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
